services:
  postgres:
    image: postgres:18
    container_name: ledgercore-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ledgercore
      POSTGRES_PASSWORD: ledgercore_dev_password
      POSTGRES_DB: ledgercore
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgercore -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: ledgercore-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ledgercore.com
      PGADMIN_DEFAULT_PASSWORD: root
    depends_on:
      - postgres

volumes:
  pgdata:
